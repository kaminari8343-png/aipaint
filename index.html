<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="うちゅうUMAずかん">
<title>うちゅうUMAずかん</title>
<style>
  :root {
    --bg: #070b24;
    --panel: #151c4a;
    --panel-2: #1f2a66;
    --text: #ffffff;
    --muted: #b8c1ff;
    --accent: #ffd84d;
    --good: #3ddc84;
    --bad: #ff6b6b;
    --space: #4da3ff;
    --uma: #b06bff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #app {
    position: relative; z-index: 1; height: 100%;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: 12px; max-width: 980px; margin: 0 auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; }
  .hud { display: flex; gap: 10px; align-items: center; font-size: 20px; font-weight: 700; }
  .chip { background: var(--panel); border-radius: 999px; padding: 8px 14px; white-space: nowrap; }
  .iconbtn {
    background: var(--panel); color: var(--text); border: 0; border-radius: 50%;
    width: 52px; height: 52px; font-size: 26px; cursor: pointer;
  }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .screen { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 14px; }
  .screen.active { display: flex; }
  h1 { font-size: clamp(30px, 6vw, 52px); margin: 0; text-align: center; line-height: 1.2; }
  h1 small { display: block; font-size: 0.45em; color: var(--muted); font-weight: 600; margin-top: 6px; }
  h2 { margin: 0; font-size: clamp(22px, 4vw, 32px); }
  .big {
    border: 0; border-radius: 22px; padding: 20px 22px; font-size: clamp(22px, 3.6vw, 30px);
    font-weight: 800; color: var(--text); cursor: pointer; background: var(--panel-2);
    box-shadow: 0 6px 0 rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s;
    font-family: inherit; text-align: center;
  }
  .big:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .big.space { background: linear-gradient(135deg, #2b6fd6, #4da3ff); }
  .big.uma { background: linear-gradient(135deg, #7a3fd1, #b06bff); }
  .big.all { background: linear-gradient(135deg, #d6812b, #ffb84d); color: #2b1600; }
  .big.sil { background: linear-gradient(135deg, #1f8f6a, #3ddc84); color: #032015; }
  .big.sub { font-size: 20px; padding: 14px 18px; background: var(--panel); }
  .big:disabled { opacity: .45; }
  .menu { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; margin-top: 4px; }
  .menu .wide { grid-column: 1 / -1; }
  .hero { text-align: center; font-size: clamp(70px, 14vw, 130px); line-height: 1; margin: 6px 0; }
  .hero .bob { display: inline-block; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(4deg); } }
  .rank { text-align: center; color: var(--muted); font-size: 20px; }

  .card {
    background: var(--panel); border-radius: 26px; padding: 22px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 12px; flex: 1; min-height: 0; justify-content: center;
    border: 3px solid transparent;
  }
  .card.space { border-color: var(--space); }
  .card.uma { border-color: var(--uma); }
  .card .emoji { font-size: clamp(80px, 18vw, 150px); line-height: 1; }
  .card .tag { font-size: 18px; color: var(--muted); font-weight: 700; }
  .card .name { font-size: clamp(30px, 6vw, 48px); font-weight: 900; }
  .card .fact { font-size: clamp(22px, 3.8vw, 30px); line-height: 1.6; max-width: 760px; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .row .big { flex: 1 1 200px; }
  .question { font-size: clamp(24px, 4.4vw, 36px); font-weight: 800; line-height: 1.5; }
  .choices { display: grid; gap: 12px; width: 100%; max-width: 760px; }
  .choice { background: var(--panel-2); }
  .choice.right { background: var(--good); color: #032015; }
  .choice.wrong { background: var(--bad); animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .sil-emoji { filter: brightness(0) invert(0.12) drop-shadow(0 0 10px rgba(120,140,255,.9)); }
  .sil-emoji.reveal { filter: none; transition: filter .5s; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; overflow-y: auto; padding: 4px 2px 20px; -webkit-overflow-scrolling: touch; }
  .tile {
    background: var(--panel); border-radius: 20px; padding: 14px 6px; text-align: center; cursor: pointer;
    border: 3px solid transparent; font-family: inherit; color: var(--text);
  }
  .tile.space { border-color: var(--space); }
  .tile.uma { border-color: var(--uma); }
  .tile.locked { opacity: .55; border-color: #333a7a; }
  .tile .e { font-size: 52px; line-height: 1.2; }
  .tile .n { font-size: 16px; font-weight: 800; margin-top: 4px; }

  #toast {
    position: fixed; left: 50%; top: 18%; transform: translate(-50%, -20px); z-index: 10; opacity: 0; pointer-events: none;
    background: var(--accent); color: #2b1d00; font-weight: 900; font-size: clamp(26px, 5vw, 42px);
    padding: 18px 30px; border-radius: 26px; transition: all .35s; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #rocket { position: fixed; z-index: 9; bottom: -120px; left: 50%; font-size: 90px; pointer-events: none; }
  #rocket.fly { animation: fly 1.3s ease-in forwards; }
  @keyframes fly { from { bottom: -120px; } to { bottom: 115%; } }
  #screen-home { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px; }
  .gamehud { display: flex; justify-content: space-between; gap: 8px; font-size: 22px; font-weight: 800; }
  .gamebox { position: relative; flex: 1; min-height: 0; border-radius: 22px; overflow: hidden; background: rgba(21,28,74,.65); border: 3px solid var(--panel-2); touch-action: none; }
  .gamebox canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .over { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(7,11,36,.85); text-align: center; padding: 20px; }
  .over.show { display: flex; }
  .over .big { min-width: 260px; }
  .over .score { font-size: clamp(30px, 6vw, 48px); font-weight: 900; line-height: 1.4; }
  .gamehint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: var(--muted); font-size: 20px; pointer-events: none; }
  .ufo { position: absolute; width: 96px; border: 0; border-radius: 22px; background: var(--panel-2); color: var(--text); padding: 6px 2px; font-family: inherit; cursor: pointer; animation: pop .25s ease-out; touch-action: manipulation; }
  .ufo span { display: block; font-size: 52px; line-height: 1.15; }
  .ufo small { display: block; font-size: 13px; font-weight: 800; }
  .ufo.caught { background: var(--good); color: #032015; transform: scale(1.2); transition: transform .2s; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (max-width: 560px) { .menu { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app">
  <header>
    <button class="iconbtn" id="btn-home" aria-label="ホーム">🏠</button>
    <div class="hud">
      <span class="chip" id="hud-stars">⭐ 0</span>
      <span class="chip" id="hud-zukan">📖 0/0</span>
    </div>
    <button class="iconbtn" id="btn-sound" aria-label="おと">🔊</button>
  </header>

  <main>
    <!-- ホーム -->
    <section class="screen active" id="screen-home">
      <h1>うちゅうUMAずかん<small>クイズにこたえて ずかんをあつめよう！</small></h1>
      <div class="hero"><span class="bob">🚀</span></div>
      <div class="rank" id="rank"></div>
      <div class="menu">
        <button class="big space" data-start="space">🪐 うちゅうたんけん</button>
        <button class="big uma" data-start="uma">🦕 UMAさがし</button>
        <button class="big all" data-start="all">🌌 ぜんぶでぼうけん</button>
        <button class="big sil" id="btn-sil">❓ シルエットゲーム</button>
        <button class="big" data-start="math" style="background:linear-gradient(135deg,#d6482b,#ff8a5c)">🔢 さんすうロケット</button>
        <button class="big" data-start="kanji" style="background:linear-gradient(135deg,#c2368f,#ff6bc1)">🈴 かんじクエスト</button>
        <button class="big all wide" id="btn-games">🎮 ミニゲーム</button>
        <button class="big sub wide" id="btn-zukan">📖 ずかんをみる</button>
      </div>
    </section>

    <!-- ヒントカード -->
    <section class="screen" id="screen-learn">
      <div class="card" id="learn-card"></div>
      <div class="row">
        <button class="big sub" id="btn-read">🔊 もういちどよむ</button>
        <button class="big all" id="btn-quiz">クイズに ちょうせん！</button>
      </div>
    </section>

    <!-- クイズ -->
    <section class="screen" id="screen-quiz">
      <div class="card" id="quiz-card"></div>
      <div class="row"><button class="big sub" id="btn-hint">💡 ヒントをもういちど</button></div>
    </section>

    <!-- シルエット -->
    <section class="screen" id="screen-sil">
      <div class="card" id="sil-card"></div>
    </section>

    <!-- ミニゲーム選択 -->
    <section class="screen" id="screen-games">
      <h2>🎮 ミニゲーム</h2>
      <div class="menu">
        <button class="big space wide" data-game="dodge">☄️ ロケットで いんせきを よけろ！<br><small id="best-dodge"></small></button>
        <button class="big uma wide" data-game="catch">🦕 UMAを つかまえろ！<br><small id="best-catch"></small></button>
      </div>
    </section>

    <!-- よけろ -->
    <section class="screen" id="screen-dodge">
      <div class="gamehud"><span class="chip" id="dodge-hud">❤️❤️❤️</span><span class="chip" id="dodge-score">⭐ 0</span></div>
      <div class="gamebox">
        <canvas id="dodge-cv"></canvas>
        <div class="gamehint" id="dodge-hint">ゆびで ロケットを よこに うごかそう！ ⭐を あつめて ☄️は さけてね</div>
        <div class="over" id="dodge-over"></div>
      </div>
    </section>

    <!-- つかまえろ -->
    <section class="screen" id="screen-catch">
      <div class="gamehud"><span class="chip" id="catch-time">⏱ 30</span><span class="chip" id="catch-score">🦕 0</span></div>
      <div class="gamebox">
        <div id="catch-area" style="position:absolute;inset:0"></div>
        <div class="over" id="catch-over"></div>
      </div>
    </section>

    <!-- ずかん -->
    <section class="screen" id="screen-zukan">
      <h2 id="zukan-title">📖 ずかん</h2>
      <div class="grid" id="zukan-grid"></div>
    </section>

    <!-- ずかん詳細 -->
    <section class="screen" id="screen-detail">
      <div class="card" id="detail-card"></div>
      <div class="row">
        <button class="big sub" id="btn-detail-read">🔊 よんでもらう</button>
        <button class="big sub" id="btn-detail-back">← ずかんにもどる</button>
      </div>
    </section>
  </main>
</div>
<div id="toast"></div>
<div id="rocket">🚀</div>

<script>
"use strict";

/* ===== データ ===== */
// cat: space / uma。quiz.a が正解、ほか2つがまちがい。
const CARDS = [
  // --- うちゅう ---
  { id: "sun", cat: "space", emoji: "☀️", name: "たいよう",
    fact: "たいようは、ひかりと ねつを だしている ほしだよ。ちきゅうが 100こ いじょう ならぶくらい おおきいんだ。",

  { id: "venus", cat: "space", emoji: "🟡", name: "きんせい",

    q: "いちばん あつい わくせいは どれ？", a: "きんせい", w: ["すいせい", "かせい"] },
  { id: "earth", cat: "space", emoji: "🌍", name: "ちきゅう",
    fact: "ちきゅうは、わたしたちの すむ ほしだよ。ほしの ひょうめんの 7わりくらいが うみなんだ。",
    q: "いきものが くらしている、わたしたちの ほしは どれ？", a: "ちきゅう", w: ["かせい", "もくせい"] },
  { id: "mars", cat: "space", emoji: "🔴", name: "かせい",

  { id: "jupiter", cat: "space", emoji: "🟠", name: "もくせい",

  { id: "saturn", cat: "space", emoji: "🪐", name: "どせい",

    q: "きれいな わっかが ある わくせいは どれ？", a: "どせい", w: ["ちきゅう", "すいせい"] },
  { id: "blackhole", cat: "space", emoji: "🕳️", name: "ブラックホール",

let soundOn = true;
let actx = null;
function beep(freqs, dur = 0.12, type = "triangle") {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach((f) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur); t += dur * 0.9;
    });
  } catch (e) {}
}
const sfx = {
  good: () => beep([523, 659, 784, 1047]),
  bad: () => beep([220, 165], 0.18, "sawtooth"),
  get: () => beep([392, 523, 659, 784, 1047, 1319], 0.1),
  tap: () => beep([660], 0.05),
};
function speak(text) {
  if (!soundOn || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 0.9; u.pitch = 1.1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const stopSpeak = () => { try { speechSynthesis.cancel(); } catch (e) {} };

let mode = "all";
let current = null;

function startAdventure(m) {
  mode = m;

}
const rand = (n) => Math.floor(Math.random() * n);
function makeMath() {
  const th = pick(MATH_THEMES);
  const add = Math.random() < 0.6;
  let a, b, ans, q, emoji;
  if (add) {
    a = 1 + rand(9); b = 1 + rand(10 - a); ans = a + b;
    q = `${th.n}が ${a}${th.u} いるよ。${b}${th.u} ふえると、ぜんぶで いくつ？`;
    emoji = th.e.repeat(a) + " ➕ " + th.e.repeat(b);
  } else {
    a = 2 + rand(9); b = 1 + rand(a - 1); ans = a - b;
    q = `${th.n}が ${a}${th.u} いるよ。${b}${th.u} いなくなると、のこりは いくつ？`;
    emoji = th.e.repeat(a) + " ➖ " + "💨".repeat(b);
  }
  const wrong = shuffle([ans - 2, ans - 1, ans + 1, ans + 2].filter((n) => n >= 0 && n <= 12)).slice(0, 2);
  return { practice: true, small: true, cat: "space", emoji, q, a: String(ans), w: wrong.map(String),
    fact: add ? `${a} + ${b} = ?  ゆびで かぞえてみよう！` : `${a} - ${b} = ?  ゆびで かぞえてみよう！` };
}
function makeKanji() {
  const it = pick(KANJI);
  const wrong = shuffle(KANJI.filter((x) => x.y !== it.y)).slice(0, 2).map((x) => x.y);
  return { practice: true, cat: "uma", emoji: it.k, q: "この かんじは なんと よむ？", say: "この かんじは なんと よむ？",
    a: it.y, w: wrong, fact: "ヒント：" + it.h };
}
function nextPractice() {
  current = mode === "math" ? makeMath() : makeKanji();
  renderQuiz();
}
function nextCard() {
  const pool = CARDS.filter((c) => mode === "all" || c.cat === mode);
  const fresh = pool.filter((c) => !isFound(c.id));
  // まだ見つけてないカードを優先。全部そろったら復習としてランダム。
  const candidates = fresh.length ? fresh : pool;
  let next = pick(candidates);
  if (current && candidates.length > 1) while (next.id === current.id) next = pick(candidates);
  current = next;
  renderLearn();
  show("learn");
  speak(current.name + "。" + current.fact);
}
function renderLearn() {
  const c = current;
  const card = $("#learn-card");
  card.className = "card " + c.cat;
  card.innerHTML = `
    <div class="tag">${CAT_LABEL[c.cat]}ヒントカード${isFound(c.id) ? "（ゲットずみ ✅）" : ""}</div>
    <div class="emoji">${c.emoji}</div>
    <div class="name">${esc(c.name)}</div>
    <div class="fact">${esc(c.fact)}</div>`;
}
function renderQuiz() {
  const c = current;

}
function answerQuiz(btn) {
  if (btn.disabled) return;
  const right = btn.dataset.ans === current.a;
  if (right) {
    btn.classList.add("right");
    document.querySelectorAll("#quiz-card .choice").forEach((b) => (b.disabled = true));

      sfx.good(); launchRocket(); save.stars += 1; persist(); updateHud();
      toast("⭐ せいかい！", 1200); speak("せいかい！");
      setTimeout(nextPractice, 1700);
      return;
    }
    sfx.good(); launchRocket();
    const first = !isFound(current.id);
    save.stars += first ? 3 : 1;
    if (first) save.found.push(current.id);
    persist(); updateHud();

    btn.classList.add("wrong"); btn.disabled = true;
    sfx.bad(); speak("おしい！ もういっかい！");

}

/* ===== シルエットゲーム（ゲットしたカードの復習） ===== */
function startSilhouette() {
  const found = save.found.map(byId);
  const target = pick(found);
  const others = shuffle(CARDS.filter((c) => c.id !== target.id && c.name !== target.name)).slice(0, 2);
  const choices = shuffle([target, ...others]);
  const card = $("#sil-card");
  card.className = "card " + target.cat;

    <div class="emoji sil-emoji" id="sil-emoji">${target.emoji}</div>

    <div class="choices">${choices.map((c) => `<button class="big choice" data-id="${c.id}">${esc(c.name)}</button>`).join("")}</div>`;
  card.dataset.target = target.id;

function answerSilhouette(btn) {
  if (btn.disabled) return;

  if (btn.dataset.id === target.id) {

    setTimeout(startSilhouette, 2200);
  } else {
    btn.classList.add("wrong"); btn.disabled = true; sfx.bad(); speak("おしい！ もういっかい！");
  }
}

/* ===== ミニゲーム ===== */
let gameStop = null;
function stopGames() { if (gameStop) { gameStop(); gameStop = null; } }
const bestKey = (g) => "best_" + g;
function award(game, score, divisor) {
  const gain = Math.min(5, Math.ceil(score / divisor));
  save.stars += gain;
  const isBest = score > (save[bestKey(game)] || 0);
  if (isBest) save[bestKey(game)] = score;
  persist(); updateHud();
  return { gain, isBest };
}
function showOver(el, game, score, divisor, unit) {
  const { gain, isBest } = award(game, score, divisor);
  el.innerHTML = `<div class="score">${isBest && score > 0 ? "🎉 しんきろく！" : "おつかれさま！"}<br>${unit} ${score}<br>⭐ +${gain}</div>
    <button class="big all" data-retry="${game}">もういっかい！</button>
    <button class="big sub" data-go="games">ミニゲームに もどる</button>`;
  el.classList.add("show");
  sfx.get(); speak(score > 0 ? "おつかれさま！ すごい！" : "つぎは がんばろう！");
}
function renderGames() {
  $("#best-dodge").textContent = "ベスト： " + (save.best_dodge || 0) + " こ";
  $("#best-catch").textContent = "ベスト： " + (save.best_catch || 0) + " ひき";
  show("games");
}

function startDodge() {
  show("dodge");
  const cv = $("#dodge-cv"), ctx = cv.getContext("2d"), box = cv.parentElement;
  const dpr = window.devicePixelRatio || 1, W = box.clientWidth, H = box.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const over = $("#dodge-over"); over.classList.remove("show"); $("#dodge-hint").style.display = "";
  const player = { x: W / 2, y: H - 70 };
  let items = [], lives = 3, score = 0, time = 0, spawn = 0.6, last = performance.now(), raf = 0, done = false, invuln = 0;
  const hud = () => { $("#dodge-hud").textContent = "❤️".repeat(lives) + "🖤".repeat(3 - lives); $("#dodge-score").textContent = "⭐ " + score; };
  const move = (e) => {
    const r = cv.getBoundingClientRect();
    player.x = Math.max(30, Math.min(W - 30, e.clientX - r.left));
    $("#dodge-hint").style.display = "none";
  };
  cv.addEventListener("pointermove", move); cv.addEventListener("pointerdown", move);
  const emoji = (ch, x, y, size) => { ctx.font = size + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(ch, x, y); };
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt; spawn -= dt; invuln -= dt;
    if (spawn <= 0) {
      spawn = Math.max(0.3, 0.85 - time * 0.01);
      items.push({ x: 30 + Math.random() * (W - 60), y: -30, v: 130 + time * 4 + Math.random() * 90, star: Math.random() < 0.3 });
    }
    ctx.clearRect(0, 0, W, H);
    items = items.filter((it) => {
      it.y += it.v * dt;
      emoji(it.star ? "⭐" : "☄️", it.x, it.y, it.star ? 40 : 46);
      if (Math.hypot(it.x - player.x, it.y - player.y) < 40) {
        if (it.star) { score++; beep([880, 1175], 0.06); }
        else if (invuln <= 0) { lives--; invuln = 0.8; sfx.bad(); }
        hud(); return false;
      }
      return it.y < H + 40;
    });
    ctx.globalAlpha = invuln > 0 && Math.floor(invuln * 10) % 2 ? 0.35 : 1;
    emoji("🚀", player.x, player.y, 56); ctx.globalAlpha = 1;
    if (lives <= 0) { finish(); return; }
    raf = requestAnimationFrame(loop);
  }
  function finish() {
    done = true; cancelAnimationFrame(raf);
    showOver(over, "dodge", score, 3, "⭐");
  }
  gameStop = () => { cancelAnimationFrame(raf); cv.removeEventListener("pointermove", move); cv.removeEventListener("pointerdown", move); };
  hud(); raf = requestAnimationFrame(loop);
}

function startCatch() {
  show("catch");
  const area = $("#catch-area"), over = $("#catch-over");
  area.innerHTML = ""; over.classList.remove("show"); over.innerHTML = "";
  const pool = CARDS.filter((c) => c.cat === "uma" && c.id !== "uma");
  let score = 0, left = 30, alive = true, spawnTimer = 0;
  const hud = () => { $("#catch-time").textContent = "⏱ " + left; $("#catch-score").textContent = "🦕 " + score; };
  function spawn() {
    if (!alive) return;
    const c = pick(pool), b = document.createElement("button");
    b.className = "ufo"; b.innerHTML = `<span>${c.emoji}</span><small>${esc(c.name)}</small>`;
    b.style.left = Math.random() * Math.max(10, area.clientWidth - 100) + "px";
    b.style.top = Math.random() * Math.max(10, area.clientHeight - 100) + "px";
    b.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (b.dataset.done) return;
      b.dataset.done = "1"; score++; b.classList.add("caught"); hud(); sfx.good(); speak(c.name);
      setTimeout(() => b.remove(), 350);
    });
    area.appendChild(b);
    setTimeout(() => b.remove(), Math.max(900, 1700 - (30 - left) * 25));
    spawnTimer = setTimeout(spawn, 500 + Math.random() * 400);
  }
  const tick = setInterval(() => {
    left--; hud();
    if (left <= 0) { stopGames(); area.innerHTML = ""; showOverCatch(); }
  }, 1000);
  function showOverCatch() {
    showOver(over, "catch", score, 4, "🦕");
  }
  gameStop = () => { alive = false; clearInterval(tick); clearTimeout(spawnTimer); };
  hud(); spawn();
}

/* ===== ずかん ===== */
function renderZukan() {
  const order = { space: 0, uma: 1 };
  $("#zukan-grid").innerHTML = CARDS.slice().sort((a, b) => order[a.cat] - order[b.cat]).map((c) => {
    const f = isFound(c.id);
    return `<button class="tile ${c.cat} ${f ? "" : "locked"}" data-id="${c.id}">
      <div class="e">${f ? c.emoji : "❔"}</div><div class="n">${f ? esc(c.name) : "？？？"}</div></button>`;
  }).join("");
  $("#zukan-title").textContent = `📖 ずかん（${save.found.length}/${CARDS.length}）`;
  show("zukan");
}
let detailCard = null;
function showDetail(id) {
  const c = byId(id);
  if (!isFound(id)) { sfx.tap(); toast("まだ みつけていないよ！ぼうけんで ゲットしよう", 1800); return; }
  detailCard = c;
  const card = $("#detail-card");
  card.className = "card " + c.cat;
  card.innerHTML = `<div class="tag">${CAT_LABEL[c.cat]}</div><div class="emoji">${c.emoji}</div>
    <div class="name">${esc(c.name)}</div><div class="fact">${esc(c.fact)}</div>`;
  show("detail");
  speak(c.name + "。" + c.fact);
}

/* ===== イベント ===== */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.start) { sfx.tap(); resetLearnButtons(); startAdventure(t.dataset.start); }
  else if (t.id === "btn-games") { sfx.tap(); renderGames(); }
  else if (t.dataset.game) { sfx.tap(); t.dataset.game === "dodge" ? startDodge() : startCatch(); }
  else if (t.dataset.retry) { sfx.tap(); t.dataset.retry === "dodge" ? startDodge() : startCatch(); }
  else if (t.dataset.go === "games") { sfx.tap(); renderGames(); }
  else if (t.id === "btn-home") { sfx.tap(); resetLearnButtons(); show("home"); }
  else if (t.id === "btn-sound") {
    soundOn = !soundOn; t.textContent = soundOn ? "🔊" : "🔇"; if (!soundOn) stopSpeak(); else sfx.tap();
  }
  else if (t.id === "btn-read") {
    if (t.dataset.mode === "home") { resetLearnButtons(); show("home"); }
    else speak(current.name + "。" + current.fact);
  }
  else if (t.id === "btn-quiz") {
    sfx.tap();
    if (t.dataset.mode === "next") { resetLearnButtons(); nextCard(); } else renderQuiz();
  }
  else if (t.id === "btn-hint") { sfx.tap(); renderLearn(); resetLearnButtons(); show("learn"); speak(current.fact); }
  else if (t.id === "btn-sil") { sfx.tap(); startSilhouette(); }
  else if (t.id === "btn-zukan") { sfx.tap(); renderZukan(); }
  else if (t.id === "btn-detail-read") { if (detailCard) speak(detailCard.name + "。" + detailCard.fact); }
  else if (t.id === "btn-detail-back") { sfx.tap(); renderZukan(); }
  else if (t.classList.contains("tile")) showDetail(t.dataset.id);
  else if (t.closest("#quiz-card") && t.dataset.ans !== undefined) answerQuiz(t);
  else if (t.closest("#sil-card") && t.dataset.id) answerSilhouette(t);
});

/* ===== ほしぞら ===== */
(function starfield() {
  const cv = $("#stars"), ctx = cv.getContext("2d");
  let w, h, stars = [];
  function resize() {
    w = cv.width = innerWidth * devicePixelRatio; h = cv.height = innerHeight * devicePixelRatio;
    stars = Array.from({ length: 90 }, () => ({ x: Math.random() * w, y: Math.random() * h, r: (Math.random() * 1.6 + 0.4) * devicePixelRatio, s: Math.random() * 0.25 + 0.05, p: Math.random() * 6 }));
  }
  function frame(t) {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.y += s.s * devicePixelRatio; if (s.y > h) { s.y = 0; s.x = Math.random() * w; }
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t / 600 + s.p);
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  addEventListener("resize", resize); resize(); requestAnimationFrame(frame);
})();

show("home");
</script>
